<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Player test</title>
  <link rel="stylesheet" href="../player.css">
  <style>body { margin: 0; background: #000; }</style>
</head>
<body>
  <!--
    The player layer on its own, for the browser tests (web/player/test/browser-test.mjs): TDLib is
    replaced by a stand in that reads local files with HTTP ranges, so every path (the Service
    Worker for the native engine, TgSource for movi) runs exactly as it does over Telegram.
  -->
  <script>
    window.TmStrings = { format: (key, args) => key + (args ? ' ' + args : '') };
    const files = new Map();
    window.TmTd = {
      reads: 0,
      bytes: 0,
      register(id, url) { files.set(id, url); },
      async readRange(id, offset, count) {
        const url = files.get(id);
        this.reads++;
        const r = await fetch(url, { headers: { Range: `bytes=${offset}-${offset + count - 1}` } });
        const buf = await r.arrayBuffer();
        this.bytes += buf.byteLength;
        return buf;
      },
      warm() {},
    };
  </script>
  <script src="../stream-host.js"></script>
  <script src="../tg-source.js"></script>
  <script src="../player.js"></script>
  <script>
    window.ready = navigator.serviceWorker
      ? navigator.serviceWorker.register('../../sw.js', { scope: '../../' }).then(() => navigator.serviceWorker.ready).then(() => true)
      : Promise.resolve(false);
    window.events = [];
    window.playFile = (name, size, mime, engine) => {
      const id = Math.floor(Math.random() * 1e6);
      TmTd.register(id, 'media/' + name);
      TmPlayer.open({
        key: 'test:' + id, title: name, name: name, mime: mime, durationSec: 0, startSec: 0,
        source: { ids: [id], sizes: [size] }, engine: engine || undefined,
        prefs: { muted: true },
      }, (e) => window.events.push(JSON.parse(e)));
      return TmPlayer.choose({ name: name, mime: mime, source: { ids: [id], sizes: [size] } });
    };
  </script>
</body>
</html>
