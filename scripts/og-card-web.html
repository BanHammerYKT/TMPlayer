<!doctype html>
<!--
  Source of web/src/wasmJsMain/resources/og.png, the 1200x630 link preview of web.tmplayer.org. The
  site's card (og-card.html) with the web app's words: the same stylesheet, type and frames, around
  the same demo screenshots, since a wide browser window draws the desktop's screens and a phone
  draws the phone's. Render it with `scripts/render-brand.sh web`.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/src/styles/styles.css">
<style>
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 400; font-display: swap; src: url("../site/public/fonts/poppins-400.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 500; font-display: swap; src: url("../site/public/fonts/poppins-500.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 600; font-display: swap; src: url("../site/public/fonts/poppins-600.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 700; font-display: swap; src: url("../site/public/fonts/poppins-700.woff2") format("woff2"); }
</style>
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; }
  .copy { position: absolute; left: 60px; top: 56px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 28px; letter-spacing: -0.01em; }
  .brand svg { width: 48px; height: 48px; }
  .brand small { font-weight: 500; font-size: 18px; padding: 4px 12px; border-radius: var(--shape-full); background: var(--surface-container); color: var(--on-surface-variant); }
  h1 { margin: 44px 0 0; font-size: 64px; line-height: 1.04; }
  h1 em { font-style: normal; color: var(--primary); }
  .sub { margin: 18px 0 0; font-size: 24px; line-height: 1.4; color: var(--on-surface-variant); max-width: 520px; }
  .foot-row { position: absolute; left: 60px; bottom: 50px; display: flex; align-items: center; gap: 10px; }
  .foot-row span { font-weight: 500; font-size: 18px; line-height: 1.4; padding: 8px 17px; border-radius: var(--shape-full); background: var(--surface-container); color: var(--on-surface); }
  .foot-row .url { margin-left: 12px; font-weight: 600; font-size: 22px; color: var(--primary); }
  .showcase { position: absolute; left: 636px; top: 104px; width: 540px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 108 108" aria-hidden="true"><rect x="0" y="0" width="108" height="108" rx="26" ry="26" fill="#1E1E28"/><path fill="#3A3A46" d="M36,33 H72 A5,5 0 0 1 77,38 V60 A5,5 0 0 1 72,65 H36 A5,5 0 0 1 31,60 V38 A5,5 0 0 1 36,33 Z"/><path fill="#0E0E12" d="M36,34.5 H72 A3.5,3.5 0 0 1 75.5,38 V60 A3.5,3.5 0 0 1 72,63.5 H36 A3.5,3.5 0 0 1 32.5,60 V38 A3.5,3.5 0 0 1 36,34.5 Z"/><path fill="#EDEDF2" d="M48,40.5 L65,49 L48,57.5 Z"/><path fill="#2AABEE" d="M36.5,70 H55.5 A2.5,2.5 0 0 1 55.5,75 H36.5 A2.5,2.5 0 0 1 36.5,70 Z"/><path fill="#3A3A46" d="M66.5,70 H71.5 A2.5,2.5 0 0 1 71.5,75 H66.5 A2.5,2.5 0 0 1 66.5,70 Z"/><circle cx="62" cy="72.5" r="5.5" fill="#EDEDF2"/></svg>TMPlayer <small>Web</small></div>
    <h1>Your videos,<br><em>in the browser</em>.</h1>
    <p class="sub">A player for the videos already in your own Telegram chats. Nothing to install.</p>
  </div>

  <div class="foot-row"><span>Free</span><span>Open source</span><span>Phone and computer</span><div class="url">web.tmplayer.org</div></div>

  <figure class="showcase">
    <div class="device device-tv device-desktop">
      <div class="screen"><img src="../site/public/screenshots/desktop-grid-light.webp" alt=""></div>
      <div class="stand"></div>
      <div class="foot"></div>
    </div>
    <div class="device device-phone">
      <div class="screen"><img src="../site/public/screenshots/phone-grid-light.webp" alt=""></div>
    </div>
  </figure>
</body>
</html>
