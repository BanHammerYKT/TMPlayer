name: Web

# TMPlayer in the browser (web/, docs/WEB.md). Builds the static site with Gradle and runs the
# player layer's browser test on generated files. Deploying to Vercel (a second project,
# "tmplayer-web", with `vercel deploy --prebuilt` of web/build/dist/wasmJs/productionExecutable)
# is added once that project exists; see docs/WEB.md, "Deployment". Nothing here deploys.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "core/**"
      - "ui/**"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "core/**"
      - "kotlin-js-store/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test the web app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Kotlin/Wasm uses the machine's Node (settings.gradle.kts forbids the download it would
      # otherwise do from a project repository).
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Core tests on Node
        run: ./gradlew :core:wasmJsTest --max-workers=2

      # The Telegram credentials end up in the page's script, exactly as they are in the APK, so
      # only a push to main gets them; a pull request builds without and the page says so.
      - name: Build the site
        env:
          TG_API_ID: ${{ github.event_name == 'push' && secrets.TG_API_ID || '' }}
          TG_API_HASH: ${{ github.event_name == 'push' && secrets.TG_API_HASH || '' }}
          TMDB_API_KEY: ${{ github.event_name == 'push' && secrets.TMDB_API_KEY || '' }}
        run: ./gradlew :web:wasmJsBrowserDistribution --max-workers=2

      - name: Player test on generated files
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp -r web/build/dist/wasmJs/productionExecutable/. "$SITE/"
          cp -r web/player/test "$SITE/player/test"
          MEDIA="$SITE/player/test/media"
          mkdir -p "$MEDIA"
          IN="-f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 20 -shortest"
          ffmpeg -v error -y $IN -c:v libx264 -c:a aac -movflags +faststart "$MEDIA/h264_aac.mp4"
          ffmpeg -v error -y $IN -c:v libvpx-vp9 -c:a libopus "$MEDIA/vp9_opus.webm"
          ffmpeg -v error -y $IN -c:v libx264 -c:a aac "$MEDIA/h264_aac.mkv"
          node web/tools/serve.mjs "$SITE" --port 8091 &
          sleep 2
          files=""
          for f in h264_aac.mp4:video/mp4 vp9_opus.webm:video/webm h264_aac.mkv:video/x-matroska; do
            name="${f%%:*}"; mime="${f#*:}"
            files="$files $name:$(stat -c %s "$MEDIA/$name"):$mime"
          done
          CHROMIUM="$(node -e "console.log(require('$RUNNER_TEMP/pw/node_modules/playwright-core').chromium.executablePath())")" \
          PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core" \
            node web/player/test/browser-test.mjs http://127.0.0.1:8091/player/test/player-test.html $files | tee player-test.txt
          ! grep -q '"failed":true' player-test.txt

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-web
          path: web/build/dist/wasmJs/productionExecutable
          retention-days: 14
          if-no-files-found: error
