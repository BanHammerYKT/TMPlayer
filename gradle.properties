org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kotlin/Wasm (web/ and :core's wasmJs target) installs its npm packages with npm, not Yarn: Yarn
# would come from a project repository, which settings.gradle.kts forbids. The lock file is
# kotlin-js-store/wasm/package-lock.json, refreshed with kotlinWasmUpgradePackageLock.
kotlin.js.yarn=false
# The web player's rules (:core js) as one file, so the browser fetches one module.
kotlin.js.ir.output.granularity=whole-program
